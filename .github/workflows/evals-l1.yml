name: evals · L1 (contract checks)

# Runs the L1 deterministic contract checks on every PR and push to main.
# No API key, no cost — safe to require as a branch-protection check.
# L2 (behavioral, LLM-in-the-loop) lives in evals-l2.yml. See scripts/eval/README.md.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  l1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # No install step — the harness is zero-dependency (node builtins + bash).
      - name: DEBUG isolate the relative-time mangling
        run: |
          echo "=== direct shell invocation ==="
          node agents/pr-reviewer/scripts/render-report.mjs scripts/eval/fixtures/report-body/pass-ci-pending.json | tail -3
          echo "=== nested spawnSync invocation (mirrors l1.mjs G25) ==="
          node -e '
            const { spawnSync } = require("node:child_process");
            const r = spawnSync("node", ["agents/pr-reviewer/scripts/render-report.mjs", "scripts/eval/fixtures/report-body/pass-ci-pending.json"], { encoding: "utf8" });
            console.log(JSON.stringify(r.stdout.slice(-250)));
          '
          echo "=== full env dump ==="
          node -e 'console.log(JSON.stringify(process.env, null, 0))'
          echo "=== Date.prototype.toISOString source ==="
          node -e 'console.log(Date.prototype.toISOString.toString())'
      - name: L1 contract checks
        run: node scripts/eval/l1.mjs
