name: evals · L1 (contract checks)

# Runs the L1 deterministic contract checks on every PR and push to main.
# No API key, no cost — safe to require as a branch-protection check.
# L2 (behavioral, LLM-in-the-loop) lives in evals-l2.yml. See scripts/eval/README.md.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  l1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # No install step — the harness is zero-dependency (node builtins + bash).
      - name: DEBUG isolate the relative-time mangling
        run: |
          echo "=== git identity ==="
          git rev-parse HEAD
          git log --oneline -3
          echo "=== sha256 of the files in play, as checked out ==="
          sha256sum agents/pr-reviewer/scripts/render-report.mjs agents/pr-reviewer/scripts/comment-spine.mjs agents/pr-reviewer/templates/report-body.md scripts/eval/fixtures/report-body/pass-ci-pending.expected.md scripts/eval/fixtures/report-body/pass-ci-pending.json
          echo "=== direct shell invocation ==="
          node agents/pr-reviewer/scripts/render-report.mjs scripts/eval/fixtures/report-body/pass-ci-pending.json | tail -3
          echo "=== expected snapshot file, tail ==="
          tail -3 scripts/eval/fixtures/report-body/pass-ci-pending.expected.md
      - name: L1 contract checks
        run: node scripts/eval/l1.mjs
