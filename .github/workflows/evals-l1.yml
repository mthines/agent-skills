name: evals · L1 (contract checks)

# Runs the L1 deterministic contract checks on every PR and push to main.
# No API key, no cost — safe to require as a branch-protection check.
# L2 (behavioral, LLM-in-the-loop) lives in evals-l2.yml. See scripts/eval/README.md.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  l1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # G63d (AC-12) diffs specific paths against `origin/main` directly. The
          # default shallow, single-ref checkout leaves no local `origin/main` to
          # diff against (`git diff --quiet origin/main` exits 128, "unknown
          # revision"), so this fetches full history for every ref.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # No install step — the harness is zero-dependency (node builtins + bash).
      - name: L1 contract checks
        run: node scripts/eval/l1.mjs

  typecheck:
    # The pr-reviewer deterministic pipeline's new agents/pr-reviewer/scripts/*.mjs
    # are `// @ts-check` (per-file, D2) against agents/pr-reviewer/scripts/tsconfig.json
    # (checkJs: false at the project level, so importing an untyped legacy script
    # never drags it into strict mode). This is a SEPARATE job from `l1` above,
    # which stays install-free — this one installs only the two type-checking
    # packages into a temp prefix, never a full `pnpm install`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install typescript + @types/node (temp prefix, no lockfile touched)
        run: npm install --no-save --prefix /tmp/ts-prefix typescript@5.9.2 @types/node@20.19.9
      - name: tsc --noEmit (agents/pr-reviewer/scripts)
        # tsc's default typeRoots resolution walks UP from the tsconfig's own
        # directory looking for node_modules/@types — /tmp/ts-prefix is never an
        # ancestor of agents/pr-reviewer/scripts, so it is never found that way
        # (TS2688 "Cannot find type definition file for 'node'"). This job never
        # runs `pnpm install`, so there is no repo-root node_modules/@types to
        # fall back on either — --typeRoots makes the temp-prefix install explicit
        # rather than relying on directory-walk luck.
        run: /tmp/ts-prefix/node_modules/.bin/tsc -p agents/pr-reviewer/scripts/tsconfig.json --typeRoots /tmp/ts-prefix/node_modules/@types
