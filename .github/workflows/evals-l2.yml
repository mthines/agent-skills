name: evals · L2 (behavioral)

# Behavioral evals: do the skills make the right runtime decisions?
# The suite list is `scripts/eval/suites.mjs` — never restated here, so it cannot drift.
#
# Each case runs a model, so this needs a secret and costs real tokens. Three things keep
# the bill down, in order of effect:
#   1. The rubric is sent as a CACHED system block, so a suite pays for its rubric once
#      instead of once per case (`l2.mjs`, and its run prints the cache hit rate).
#   2. A pull_request runs only the suites its changed files can affect
#      (`scripts/eval/select-suites.mjs`), not all nine.
#   3. The trigger is path-filtered, so an unrelated PR does not start it at all.
#
# Setup (one-time): add an ANTHROPIC_API_KEY repository secret
#   (Settings → Secrets and variables → Actions → New repository secret).
# Without the secret the job still runs and passes — the script skips cleanly —
# so this is safe to require as a check and safe for fork PRs.

on:
  pull_request:
    paths:
      # rubric sources (read live by the eval)
      - "skills/workflow/autonomous-workflow/aw/SKILL.md"
      - "skills/workflow/autonomous-workflow/templates/routing.rule.md"
      - "skills/workflow/autonomous-workflow/SKILL.md"
      - "skills/workflow/autonomous-workflow/rules/phase-0-validation.md"
      - "skills/workflow/fix-bug/SKILL.md"
      - "agents/pr-reviewer.md"
      # eval harness + golden sets
      - "scripts/eval/l2.mjs"
      - "scripts/eval/lib.mjs"
      - "scripts/eval/golden/**"
  workflow_dispatch:
    inputs:
      suite:
        description: >-
          One suite name to run (e.g. code-review-retrieval-relevance).
          Leave blank to run all of them.
        required: false
        type: string

permissions:
  contents: read

jobs:
  l2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the changed-file diff below can reach the PR's merge base.
          # A shallow clone makes that diff fail, which fails OPEN (every suite runs) —
          # correct, but it silently spends the full nine-suite price on every PR.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Which suites can this PR's changes actually affect? A suite's result depends on
      # exactly two inputs — the rubric file it reads live and the golden set that labels
      # it — so a PR touching one golden file has no way to move the other eight suites.
      # Running all nine anyway cost ~273k input tokens per PR for 149 one-word answers.
      #
      # Fails OPEN, deliberately and in one direction: if the diff cannot be computed, or
      # the selector errors, or this is not a pull_request, SUITES is left empty and every
      # suite runs. A selector bug must never be able to silently skip coverage — the
      # worst case is paying the old price, which is the price we were already paying.
      - name: Select affected suites
        id: select
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if ! CHANGED=$(git diff --name-only "$BASE_SHA...$HEAD_SHA" 2>&1); then
            echo "::warning::could not diff $BASE_SHA...$HEAD_SHA — running every suite"
            echo "$CHANGED"
            exit 0
          fi
          echo "changed files:"; echo "$CHANGED" | sed 's/^/  /'
          if ! SEL=$(printf '%s\n' "$CHANGED" | node scripts/eval/select-suites.mjs); then
            echo "::warning::select-suites.mjs failed — running every suite"
            exit 0
          fi
          if [ -z "$SEL" ]; then
            # Reachable: the `paths:` filter above is broader than the suite table (it lists
            # rubric sources that no suite reads live). Skipping is correct here — no suite's
            # inputs changed — and is NOT the fail-open path above, which leaves this unset.
            echo "no suite's rubric or golden set changed — nothing to run"
            echo "none=true" >> "$GITHUB_OUTPUT"
          else
            echo "selected: $SEL"
            echo "suites=$SEL" >> "$GITHUB_OUTPUT"
          fi

      - name: L2 behavioral evals
        if: steps.select.outputs.none != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Conservative catastrophic floor, applied per suite. A healthy rubric
          # scores ~90%+; 70% only trips on a badly-broken rubric, not 1–2 cases
          # of model noise on these < 50-case sets. Tighten (or move to
          # 0%-regression-vs-baseline) once a golden set reaches ≥ 50 — see
          # scripts/eval/README.md.
          EVAL_GATE: "70"
          # Two independent sources, and a manual dispatch always wins so an operator can
          # force a suite regardless of what changed. On pull_request `inputs.suite` is
          # empty and the selector's list is used; if the selector failed open, BOTH are
          # empty and every suite runs.
          EVAL_SUITE: ${{ inputs.suite }}
          SELECTED_SUITES: ${{ steps.select.outputs.suites }}
        run: |
          SUITE="${EVAL_SUITE:-$SELECTED_SUITES}"
          if [ -n "$SUITE" ]; then
            echo "running suites: $SUITE"
            node scripts/eval/l2.mjs --suite "$SUITE"
          else
            echo "running every suite"
            node scripts/eval/l2.mjs
          fi
