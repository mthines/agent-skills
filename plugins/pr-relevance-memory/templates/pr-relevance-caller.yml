# PR Relevance Memory — caller workflow
#
# Copy this file to:
#   YOUR_REPO/.github/workflows/pr-relevance-memory.yml
#
# Then add LOREKIT_API_KEY to your repo's:
#   Settings → Secrets and variables → Actions → New repository secret
#
# That's the entire setup.  The classification logic lives in mthines/agent-skills
# and stays up-to-date automatically as you point to a version tag or @main.
#
# What this does:
#   - When a reviewer resolves a PR thread → records whether it was fixed or dismissed
#   - When a PR is merged → sweeps any still-open threads as "ignored at merge"
#   These signals accumulate in LoreKit under your repo's scope and make the
#   reviewer / pr-reviewer agents progressively more accurate on your codebase.
#
# See: https://github.com/mthines/agent-skills/blob/main/agents/shared/rules/comment-relevance-memory.md

name: PR relevance memory

on:
  pull_request_review_thread:
    types: [resolved]
  pull_request:
    types: [closed]

permissions:
  contents: read
  pull-requests: read

jobs:
  thread-resolved:
    name: Record resolved thread
    if: github.event_name == 'pull_request_review_thread'
    uses: mthines/agent-skills/.github/workflows/reviewer-comment-relevance.yml@main
    with:
      mode: thread-resolved
      pr_number: ${{ github.event.pull_request.number }}
      comment_id: ${{ github.event.thread.comments[0].id }}
      comment_path: ${{ github.event.thread.comments[0].path }}
      comment_line: ${{ github.event.thread.comments[0].line }}
      comment_body: ${{ github.event.thread.comments[0].body }}
      comment_created_at: ${{ github.event.thread.comments[0].created_at }}
    secrets:
      lorekit_api_key: ${{ secrets.LOREKIT_API_KEY }}

  pr-merged:
    name: Sweep open threads at merge
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true
    uses: mthines/agent-skills/.github/workflows/reviewer-comment-relevance.yml@main
    with:
      mode: pr-merged
      pr_number: ${{ github.event.pull_request.number }}
    secrets:
      lorekit_api_key: ${{ secrets.LOREKIT_API_KEY }}
